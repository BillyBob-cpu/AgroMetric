<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroSuivi — Observations</title>
  <meta name="description" content="Saisie et historique des observations terrain.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app-layout">
  <header class="topbar">
    <div class="topbar-logo"><span>🌾</span> AgroSuivi</div>
    <div class="topbar-right">
      <div class="topbar-date" id="topbar-date"></div>
      <button class="btn-logout" onclick="logout()">Se déconnecter</button>
    </div>
  </header>
  <nav class="sidebar">
    <div class="nav-section">Navigation</div>
    <a href="index.html"        class="nav-item"><span class="nav-icon">📊</span> Tableau de bord</a>
    <a href="parcelles.html"    class="nav-item"><span class="nav-icon">🗺️</span> Parcelles</a>
    <a href="observations.html" class="nav-item active"><span class="nav-icon">📝</span> Observations</a>
    <a href="alertes.html"      class="nav-item"><span class="nav-icon">🔔</span> Alertes</a>
  </nav>
  <main class="main-content">
    <h1 class="page-title">Observations terrain</h1>
    <p class="page-subtitle">Saisie et historique des états de cultures</p>

    <div style="display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start;">

      <div class="card">
        <div class="card-header">Nouvelle observation</div>
        <div class="card-body">
          <div id="form-msg" style="display:none;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:14px;"></div>
          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;">DATE</label>
            <input type="date" id="obs-date" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;">
          </div>
          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;">PARCELLE</label>
            <select id="obs-parcelle" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg-card);">
              <option value="">Sélectionner…</option>
            </select>
          </div>
          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;">ÉTAT OBSERVÉ</label>
            <select id="obs-etat" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg-card);">
              <option value="OK">OK</option>
              <option value="Risque maladie">Risque maladie</option>
              <option value="Maladie détectée">Maladie détectée</option>
              <option value="Stress hydrique">Stress hydrique</option>
            </select>
          </div>
          <div style="margin-bottom:18px;">
            <label style="font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;">COMMENTAIRE</label>
            <textarea id="obs-commentaire" rows="3" placeholder="Ex : feuilles jaunies, sol sec…"
              style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;resize:vertical;font-family:inherit;"></textarea>
          </div>
          <button onclick="submitObservation()"
            style="width:100%;padding:10px;background:var(--color-primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;">
            Enregistrer l'observation
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          Historique
          <div style="display:flex;align-items:center;gap:12px;">
            <span id="obs-total" style="font-size:13px;color:var(--text-muted);font-weight:400;">Total : —</span>
            <select id="filtre-parcelle" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg-card);">
              <option value="">Toutes les parcelles</option>
            </select>
            <select id="filtre-etat" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg-card);">
              <option value="">Tous les états</option>
              <option>OK</option><option>Risque maladie</option>
              <option>Maladie détectée</option><option>Stress hydrique</option>
            </select>
            <button onclick="resetFiltres()"
              style="padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:var(--bg-card);color:var(--text-secondary);cursor:pointer;white-space:nowrap;">
              Réinitialiser
            </button>
          </div>
        </div>
        <div style="padding:0;">
          <table class="data-table">
            <thead><tr><th>Date</th><th>Parcelle</th><th>État</th><th>Commentaire</th></tr></thead>
            <tbody id="obs-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/observations.js"></script>
</body>
</html>
